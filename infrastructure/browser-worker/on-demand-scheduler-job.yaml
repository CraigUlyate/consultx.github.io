name: job-consultx-filing-sched-dev
location: southafricanorth
identity:
  type: UserAssigned
  userAssignedIdentities:
    /subscriptions/0dbaa65b-80fe-4435-ba06-60e1253eb5f5/resourcegroups/rg-consultx-dev/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-consultx-portal-dev: {}
properties:
  environmentId: /subscriptions/0dbaa65b-80fe-4435-ba06-60e1253eb5f5/resourceGroups/rg-consultx-dev/providers/Microsoft.App/managedEnvironments/cae-consultx-dev
  configuration:
    triggerType: Schedule
    replicaTimeout: 600
    replicaRetryLimit: 0
    scheduleTriggerConfig:
      cronExpression: "0 16 * * *"
      parallelism: 1
      replicaCompletionCount: 1
    registries:
      - server: acrconsultxdev0dbaa65b.azurecr.io
        identity: /subscriptions/0dbaa65b-80fe-4435-ba06-60e1253eb5f5/resourcegroups/rg-consultx-dev/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-consultx-portal-dev
    secrets:
      - name: portal-database-url
        keyVaultUrl: https://kv-consultx-dev-0dbaa65b.vault.azure.net/secrets/portal-database-url
        identity: /subscriptions/0dbaa65b-80fe-4435-ba06-60e1253eb5f5/resourcegroups/rg-consultx-dev/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-consultx-portal-dev
  template:
    containers:
      - name: filing-scheduler
        image: acrconsultxdev0dbaa65b.azurecr.io/portal-server:on-demand-email
        command: [node]
        args: [scripts/check-filing-queue.mjs]
        resources:
          cpu: 0.25
          memory: 0.5Gi
        env:
          - name: DATABASE_URL
            secretRef: portal-database-url
          - name: AZURE_SUBSCRIPTION_ID
            value: 0dbaa65b-80fe-4435-ba06-60e1253eb5f5
          - name: AZURE_RESOURCE_GROUP
            value: rg-consultx-dev
          - name: CIPC_BROWSER_VM_NAME
            value: vm-consultx-cipc-worker-dev
          - name: SERVICE_BUS_NAMESPACE
            value: sb-consultx-dev-0dbaa65b.servicebus.windows.net
          - name: AZURE_CLIENT_ID
            value: 032f83df-08f7-4da9-8464-dece1ba162be
          - name: ACS_ENDPOINT
            value: https://acs-consultx-dev.europe.communication.azure.com
          - name: CIPC_NOTIFICATION_SENDER
            value: DoNotReply@notifications.consultx.co.za
          - name: CIPC_OPERATOR_EMAIL
            value: craig@consultx.co.za
