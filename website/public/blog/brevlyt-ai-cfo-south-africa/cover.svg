<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">ConsultX and Brevlyt AI CFO partnership</title>
  <desc id="desc">A clean blue and white financial intelligence interface representing the ConsultX and Brevlyt partnership.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f9fc"/>
      <stop offset="1" stop-color="#edf2ff"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f66dc"/>
      <stop offset="1" stop-color="#6d8cf5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#1d2a48" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="1600" height="720" fill="url(#bg)"/>
  <circle cx="1335" cy="40" r="260" fill="#dbe5ff" opacity=".7"/>
  <circle cx="1450" cy="640" r="330" fill="#e7edff" opacity=".8"/>
  <g transform="translate(110 100)">
    <rect x="0" y="0" rx="26" width="210" height="46" fill="#edf2ff"/>
    <circle cx="24" cy="23" r="6" fill="#4c6fe7"/>
    <text x="42" y="29" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#315fd9">PARTNERSHIP ANNOUNCEMENT</text>
    <text x="0" y="115" font-family="Arial, Helvetica, sans-serif" font-size="60" font-weight="800" fill="#15171a">ConsultX + Brevlyt</text>
    <text x="0" y="185" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#15171a">Autonomous CFO AI for South Africa</text>
    <text x="0" y="250" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#5c6470">Continuous financial intelligence. Human judgement. Practical outcomes.</text>
    <rect x="0" y="310" rx="30" width="180" height="58" fill="url(#blue)"/>
    <text x="44" y="347" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Book a demo</text>
  </g>
  <g transform="translate(865 105)" filter="url(#shadow)">
    <rect width="620" height="500" rx="28" fill="#ffffff"/>
    <rect width="620" height="52" rx="28" fill="#f0f1f3"/>
    <circle cx="28" cy="26" r="7" fill="#d2d5da"/>
    <circle cx="50" cy="26" r="7" fill="#d2d5da"/>
    <circle cx="72" cy="26" r="7" fill="#d2d5da"/>
    <rect x="102" y="14" width="475" height="24" rx="8" fill="#ffffff"/>
    <text x="118" y="31" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#999fa8">app.brevlyt.com</text>
    <rect x="28" y="86" width="564" height="270" rx="22" fill="#ffffff" stroke="#e7e9ed"/>
    <text x="56" y="124" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#4c6fe7">FINDING</text>
    <text x="56" y="166" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800" fill="#17191d">Margin pressure detected</text>
    <text x="56" y="208" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#626a78">Gross margin has declined despite stable revenue.</text>
    <text x="56" y="240" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#626a78">Collections are slowing while input costs are increasing.</text>
    <rect x="56" y="278" width="500" height="48" rx="14" fill="#f5f8ff"/>
    <circle cx="79" cy="302" r="9" fill="#4c6fe7"/>
    <path d="M75 302l3 3 6-7" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="99" y="308" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#44516a">Review pricing, supplier terms and working-capital drivers.</text>
    <rect x="28" y="382" width="564" height="56" rx="16" fill="#fbfbfc" stroke="#e7e9ed"/>
    <text x="52" y="416" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#a0a6ae">Ask your CFO</text>
    <text x="558" y="416" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#a0a6ae">→</text>
  </g>
</svg>
